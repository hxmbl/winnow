<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!--
      The tab icon. favicon.svg follows the OS scheme on its own (an @media rule inside
      the SVG), because Chromium ignores `media` on <link rel="icon">. Safari has no SVG
      favicons, so it takes the PNG/ICO; iOS home screens take the touch icon.
    -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      The stored theme, applied before first paint. A classic blocking script from
      'self' — the desktop CSP forbids inline script — so `index.css` can paint the
      right backdrop before the bundle has loaded. See the file for why.
    -->
    <script src="/theme-boot.js"></script>
    <!--
      No Referer on anything this document loads or links to: a remote image the reader
      allowed, a background, a logo. Every Winnow request that needs an identity carries
      a token instead, and the app's address is nobody else's business.
    -->
    <meta name="referrer" content="no-referrer" />
    <title>Winnow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

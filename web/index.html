<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!--
      Two favicons, chosen by the OS scheme. The tab strip is not ours to theme, so
      a single black-on-white mark is invisible in a dark tab — and the app's own
      mark does not have this problem, being inline and driven by the theme tokens.
    -->
    <link rel="icon" type="image/svg+xml" href="/relayLight.svg" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/relayDark.svg"
      media="(prefers-color-scheme: dark)"
    />
    <!--
      The stored theme, applied before first paint. A classic blocking script from
      'self' — the desktop CSP forbids inline script — so `index.css` can paint the
      right backdrop before the bundle has loaded. See the file for why.
    -->
    <script src="/theme-boot.js"></script>
    <title>Winnow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

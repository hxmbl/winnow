<svg xmlns="http://www.w3.org/2000/svg" viewBox="66.075 81.930 344.000 344.000">
  <!--
    The tab icon. One file that follows the OS scheme itself: Chromium ignores a
    media query on <link rel="icon">, so two files chosen in index.html showed the
    wrong one (or, with relayDark.svg malformed, none). Classes rather than inline
    styles, because an inline style would beat the media query.
  -->
  <style>
    .plane { fill: #000; stroke: #000; stroke-width: 5; stroke-linejoin: round; }
    .paper { fill: #fff; stroke: #000; stroke-width: 5; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .plane { fill: #e8edf2; stroke: #e8edf2; }
      .paper { fill: #151a20; stroke: #e8edf2; }
    }
  </style>
  <g transform="translate(-35.849192 -11.030521)"><path class="plane" d="m 234.85817,373.19928 79.97127,-157.64452 57.79819,42.0129 11.19359,-8.03777 7.76226,21.63708 46.42011,41.82405 z"/><path class="paper" d="m 267.08615,348.39093 104.87384,-90.31765 11.86123,-8.54339 6.80232,21.933 z"/></g><path class="plane" d="m 278.52065,145.69479 -81.8097,160.40216 -56.99102,-41.82406 -16.35541,24.54466 -3.40761,-38.79242 -45.960501,-42.28366 z"/><path class="paper" d="m 224.24298,186.86915 -102.90725,61.08776 2.02879,40.86064 16.35541,-24.54466 z"/>
</svg>

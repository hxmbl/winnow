<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  The app mark, inverted for dark surfaces.

  `relayLight.svg` is a black mark on white, which is invisible in a browser tab
  whose chrome is dark — and a browser tab is not ours to theme. This copy swaps
  the two fills, and `index.html` picks between them with the same
  `prefers-color-scheme` query the OS uses. The in-app mark does not need this: it
  is inline and follows the theme tokens (`ui/AppMark`).
-->
<svg
   width="512"
   height="512"
   viewBox="0 0 512 512"
   version="1.1"
   id="svg1"
   xmlns="http://www.w3.org/2000/svg"><g
     id="g4"
     transform="translate(-35.849192,-11.030521)"><path
       style="display:inline;fill:#e8edf2;fill-rule:nonzero;stroke-width:5;stroke-dasharray:none;fill-opacity:1;stroke:#e8edf2;stroke-opacity:1"
       d="m 234.85817,373.19928 79.97127,-157.64452 57.79819,42.0129 11.19359,-8.03777 7.76226,21.63708 46.42011,41.82405 z"
       id="path2" /><path
       style="fill:#151a20;stroke:#e8edf2;stroke-width:5;stroke-dasharray:none;stroke-opacity:1;fill-rule:nonzero;fill-opacity:1"
       d="m 267.08615,348.39093 104.87384,-90.31765 11.86123,-8.54339 6.80232,21.933 z"
       id="path3" /></g><g
     id="g5"

# nginx for the Winnow web image. Runs as an unprivileged user on port 8080; every
# path it writes is under /tmp, so the container can run with a read-only root.
#
# What is generated on start (docker/web/configure.sh), under /tmp/winnow/nginx:
#   headers.conf  Content-Security-Policy and friends, from the bundle's `_headers`
#   proxy.conf    /render and /asset/ forwarded to the render proxy, when there is one
#
# `add_header` in a location replaces the server's, so each location includes
# headers.conf itself.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  types {
    application/manifest+json webmanifest;
  }

  access_log off;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  client_body_temp_path /tmp/nginx/client_temp;
  proxy_temp_path /tmp/nginx/proxy_temp;
  fastcgi_temp_path /tmp/nginx/fastcgi_temp;
  uwsgi_temp_path /tmp/nginx/uwsgi_temp;
  scgi_temp_path /tmp/nginx/scgi_temp;

  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

  # The render proxy refuses any request whose Origin is not on its allowlist
  # (proxy/README.md, "Cross-origin"), and a browser sends Origin on the app's own
  # same-origin POST. Behind this server the proxy *is* same-origin, so an Origin that
  # names this very host is dropped before forwarding; any other Origin is passed on
  # untouched and the proxy refuses it as before.
  map "$http_origin|$http_host" $winnow_forward_origin {
    "~^https?://([^/|]+)\|\1$" "";
    default $http_origin;
  }

  server {
    listen 8080 default_server;
    server_name _;
    root /tmp/winnow/www;
    index index.html;
    absolute_redirect off;

    include /tmp/winnow/nginx/proxy.conf;

    # Liveness: answers once nginx is up and the bundle is in place.
    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    # Fingerprinted by Vite: a new build is a new name, so these never change.
    location ^~ /assets/ {
      include /tmp/winnow/nginx/headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # Written on every start; must never be cached.
    location = /config.js {
      include /tmp/winnow/nginx/headers.conf;
      add_header Cache-Control "no-store" always;
      try_files $uri =404;
    }

    # A deep link's page asks for its files relative to itself (the build's base is
    # "./", so the same bundle works at a sub-path and in Tauri): /a/b/config.js,
    # /a/b/assets/index-….js. Serve the top-level file of that name, or a 404 — never
    # index.html as a script.
    location ~ ^/.+?/(assets/[^/]+|[^/]+\.(?:js|css|svg|png|ico|woff2|webmanifest))$ {
      include /tmp/winnow/nginx/headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri /$1 =404;
    }

    # index.html and the unhashed files (theme-boot.js, icons): revalidate every time,
    # so a restart that brought a new version is seen on the next load. Anything that
    # is not a file is a deep link into the app: the SPA's index.html.
    location / {
      include /tmp/winnow/nginx/headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ /index.html;
    }
  }
}

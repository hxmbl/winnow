[package]
# Not plain `winnow`: that is also the name of a parser crate in our build
# dependencies (via toml), and `cargo tauri android build` passes
# `--package <name>`, which cargo rejects as ambiguous. The binary keeps its
# name through `[[bin]]` below, so desktop bundles are unchanged.
name = "winnow-app"
version = "1.6.4"
description = "Winnow — an email client that sorts the noise out for you"
authors = ["hxmbl"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "winnow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "winnow"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `image-ico` alongside `image-png`: `default_window_icon()` reads the platform's
# own format, so on Windows a PNG-only bundle builds fine and then has no icon to
# put in the tray.
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }

tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tiny_http = "0.12"
tokio = { version = "1", features = ["sync", "rt", "time"] }
url = "2"
parking_lot = "0.12"

# `tauri-plugin-os` and `tauri-plugin-store` were both listed here and neither was
# called: the frontend reports its own platform facts through `app_info`, and
# persistence is `localStorage` in the web layer (the *secrets* go to the keychain,
# which is `keyring` directly). Removing them takes two plugins out of the binary
# and two sets of ACL permissions out of the window's reach — `capabilities/default.json`
# no longer grants either, so leaving the dependencies would mean granting nothing
# for something that exists.

# Desktop only: none of these has an Android backend. `lib.rs` gates every use
# with `#[cfg(desktop)]`, so a mobile build compiles without them.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Self-update (`src/updater.rs`): the macOS app and the AppImage replace themselves
# from the release's signed `latest.json`. Linux and macOS only; Windows has no build.
#
# Default features minus `zip`. That feature only unpacks Windows `.zip` updates and
# gzipped AppImages (`.AppImage.tar.gz`, the old v1 updater format). Winnow ships neither:
# the updater artifacts are a plain `.AppImage` and the macOS `.app.tar.gz`, whose tar
# and flate2 the plugin always uses on macOS. Leaving it on kept `zip` 4.x in Cargo.lock,
# with path-traversal advisories (RUSTSEC-2026-0367/-0368/-0369), for code never built.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }

# Android: `keyring` has no Android backend, so secrets go through the keyring
# project's own Android store instead: values in SharedPreferences, encrypted
# with an AES-GCM key that lives in the Android Keystore. It finds the app
# through `ndk-context`, which Tauri's Android runtime (tao) initialises in the
# activity's `onCreate`, so no Kotlin glue is needed.
[target.'cfg(target_os = "android")'.dependencies]
keyring-core = "1"
android-native-keyring-store = "1"
# Writes an attachment to the `content://` URI Android's save picker returns.
# Already in the tree through the dialog plugin; registered on Android only.
tauri-plugin-fs = "2"

# Notification buttons on Linux (D-Bus actions) and Windows (WinRT toast buttons):
# `tauri-plugin-notification` already depends on it there, at this version, and
# offers no actions on the desktop. See `src/notify_actions/desktop.rs`.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
notify-rust = "4.11"

# Notifications that take themselves down (`notify_actions/shown.rs`). Each is already in
# the tree at this version through notify-rust or tauri-plugin-notification, so none
# adds a crate to the build:
# - Linux: `CloseNotification` over the session bus (`zbus`, notify-rust's own D-Bus stack).
[target.'cfg(target_os = "linux")'.dependencies.zbus]
version = "5"
default-features = false
features = ["async-io", "blocking-api"]

# - Windows: clearing Winnow's Action Center entries (`ToastNotificationHistory`).
[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = ["UI_Notifications"]

# - macOS: removing a delivered notification from Notification Centre (`NSUserNotificationCenter`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# Downloads a release `.deb` for a package install (`updater.rs`). Both already in the
# tree through `tauri-plugin-updater`, with the same versions and features (rustls with
# the ring provider), so this adds no second HTTP client or TLS stack.
[target.'cfg(target_os = "linux")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Checking a downloaded `.deb` against the release's SHA256SUMS before it opens.
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1

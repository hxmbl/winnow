name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  # Cut release dispatches CI on the tag it pushed: a push made with GITHUB_TOKEN
  # starts no workflows, so the tag push above never fires for it.
  workflow_dispatch:
    inputs:
      publish:
        description: 'On a v* tag: publish the release once every build is attached'
        type: boolean
        default: false
      android_build:
        description: 'On a branch: also build a debug APK and run the Android unit tests'
        type: boolean
        default: false

permissions:
  contents: read
  # dorny/paths-filter lists a PR's changed files through the API.
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs, but let every push to master finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  minesweep:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install minesweep
        run: |
          set -euo pipefail
          TAG="$(curl -fsSL -o /dev/null -w '%{url_effective}' https://github.com/hxmbl/minesweep/releases/latest)"
          TAG="${TAG##*/}"
          VERSION="${TAG#v}"
          case "$(uname -m)" in
            x86_64) ARCH=x86_64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          FILE="minesweep_${VERSION}_$(uname -s)_${ARCH}.tar.gz"
          BASE="https://github.com/hxmbl/minesweep/releases/download/${TAG}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$BASE/$FILE"
          curl -fsSLO "$BASE/checksums.txt"
          grep " ${FILE}\$" checksums.txt | sha256sum -c -
          tar -xzf "$FILE" minesweep
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 minesweep "$RUNNER_TEMP/bin/minesweep"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "Installed minesweep ${TAG}"

      - name: Scan for secrets
        # --config: an auto-discovered .minesweep.yml has its fail-on/policy keys ignored.
        # Exit 1 = findings >= high, exit 2 = incomplete scan; both fail the job.
        run: minesweep --config .minesweep.yml --fail-on high --annotations --no-pager .

  npm-checks:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check versions
        run: node scripts/check-version.mjs

      # Each version's section is its release notes (release.yml), so the file must parse.
      - name: Check CHANGELOG.md
        run: node scripts/release-notes.mjs lint

      - name: Check the smoke shards cover npm run smoke
        run: node scripts/smoke-shards.mjs --check

      - name: Typecheck, lint and test
        run: npm run check

  # Every push to master builds the Rust side; a PR only does when it touches it.
  changes:
    name: Detect changes
    # Only PRs consult it. On a push, paths-filter diffs against the previous commit
    # with git, which fails on the shallow, credential-less checkout (exit 128).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.filter.outputs.native }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            native:
              - 'native/**'
              - '.github/workflows/ci.yml'
            android:
              - 'native/src-tauri/gen/android/**'
              - 'native/src-tauri/src/google_signin.rs'

  # The smoke run (`npm run smoke`, ~11 min in one job) split into parallel shards.
  # `web/scripts/smoke-shards.mjs` says which parts of smoke.mjs and which standalone
  # scripts each shard runs, and `npm-checks` fails if the shards stop covering the
  # whole of `npm run smoke` or this matrix stops naming exactly those shards.
  smoke-shard:
    name: Smoke (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Every shard reports, so one red shard does not hide another's failures.
      fail-fast: false
      matrix:
        shard: [core, contexts-a, contexts-b, modules-a, modules-b, modules-c]
    # Playwright's own image ships the browsers and their system libraries, so the job
    # skips the download and the apt step. Its tag must match the locked `playwright`
    # version (1.63.0) or the browser build will not be the one the library expects.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The production bundle, built per shard: ~15s here in parallel, against a separate
      # build-and-upload job every shard would have to wait for. `vite build` alone, as
      # `npm run build`'s `tsc -b` (noEmit) is the typecheck `npm-checks` already runs.
      - name: Build the production bundle
        run: npx vite build --logLevel warn

      - name: Smoke test (${{ matrix.shard }})
        run: node scripts/smoke-shards.mjs "${{ matrix.shard }}"

  # The one check that stands for the whole smoke run (the name branch protection and
  # `trigger-release` rely on): green only when every shard passed.
  smoke:
    name: Smoke test
    needs: smoke-shard
    # Not on a cancelled run (a superseded PR push), where there is nothing to report.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every smoke shard passed
        env:
          RESULT: ${{ needs.smoke-shard.result }}
        run: |
          echo "smoke shards: $RESULT"
          test "$RESULT" = success

  # The Rust side's own gate: formatting, clippy with warnings as errors, and the
  # unit tests in commands/deep_link/files/oauth/scheduler. Runs on every event, so
  # a tag can't be released past a Rust test failure.
  rust-checks:
    name: Rust fmt, clippy and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/src-tauri -> target
          key: checks
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config wget

      # tauri::generate_context! embeds web/dist at compile time and fails without
      # it; an empty page is enough to compile and test against.
      - name: Stub the frontend
        run: mkdir -p web/dist && echo '<!doctype html>' > web/dist/index.html

      - name: Format
        working-directory: native/src-tauri
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: native/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        working-directory: native/src-tauri
        run: cargo test --locked

  # Debug, unbundled: proves the Rust side compiles without paying for LTO and packaging.
  # Runs on master too, so PRs inherit a warm debug cache.
  build:
    name: Build (debug)
    needs: changes
    # PRs that touch native code only. A push to master already compiles the same
    # crate in the release job, so a debug build there was a second, redundant compile.
    if: github.event_name == 'pull_request' && needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/src-tauri -> target
          # PR caches are only visible to that PR; master's are visible to every PR.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install Linux dependencies
        # Plain apt, not cache-apt-pkgs-action: that action restores files without
        # running the packages' install scripts, and every native build failed from
        # the commit that introduced it.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config wget

      # Prebuilt binary instead of compiling the CLI from source on every run.
      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install Tauri CLI
        run: cargo binstall tauri-cli --version "^2" --no-confirm

      - name: Install dependencies
        run: npm ci

      - name: Debug build
        working-directory: native
        run: cargo tauri build --debug --no-bundle

  # Type-checks the crate for Android on PRs that touch native code. `cargo check`
  # needs no NDK or SDK (nothing links), so this costs a Rust target and a cache;
  # the APK itself is built by release.yml.
  android-check:
    name: Android compile check
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native/src-tauri
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/src-tauri -> target
          key: android-check
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Check (aarch64-linux-android)
        run: cargo check --target aarch64-linux-android

  # The Kotlin side: a debug APK for one ABI (which compiles the Kotlin, the plugin
  # included, against the Tauri Android library) and the JVM unit tests under
  # gen/android/app/src/test. `android-check` above never compiles Kotlin, and the
  # release job is the only other place that does, so a PR that touches the Android
  # project runs this; any branch can ask for it with the `android_build` input.
  android-build:
    name: Android debug build and unit tests
    needs: changes
    if: >-
      ${{ !cancelled() && (
        (github.event_name == 'pull_request' && needs.changes.outputs.android == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.android_build && github.ref_type == 'branch')
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The release job's NDK, so the two cannot build differently.
      NDK_VERSION: "27.2.12479018"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install the NDK
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${NDK_VERSION}" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/src-tauri -> target
          key: android-build
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install Tauri CLI
        run: cargo binstall tauri-cli --version "^2" --no-confirm

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Debug-signed, arm64 only: this proves the build, it ships nothing.
      - name: Build debug APK
        working-directory: native
        run: cargo tauri android build --debug --apk --target aarch64

      - name: Android unit tests
        working-directory: native/src-tauri/gen/android
        run: ./gradlew --no-daemon :app:testUniversalDebugUnitTest

  # The full release bundle (LTO, deb, AppImage) only where an artifact could matter.
  release:
    name: Release build
    # Branch pushes only: on a tag, release.yml builds these bundles itself, so a
    # third Linux bundle here would only cost time.
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/src-tauri -> target
          # PR caches are only visible to that PR; master's are visible to every PR.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install Linux dependencies
        # Plain apt, not cache-apt-pkgs-action: that action restores files without
        # running the packages' install scripts, and every native build failed from
        # the commit that introduced it.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config wget

      # Prebuilt binary instead of compiling the CLI from source on every run.
      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install Tauri CLI
        run: cargo binstall tauri-cli --version "^2" --no-confirm

      - name: Install dependencies
        run: npm ci

      # Proves the bundle builds; release.yml ships it on a `v*` tag.
      - name: Production build
        run: npm run tauri:build

  trigger-release:
    name: Trigger release
    # Only on tag pushes, after every gate that also runs on a tag has passed.
    # `release` is deliberately absent: it is branch-only, so naming it here would
    # skip this job on the one push it exists for.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    needs: [minesweep, npm-checks, smoke, rust-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Dispatching a workflow is an Actions write; job-level permissions zero every
    # scope they don't name, so `contents: write` alone made this a 403.
    permissions:
      actions: write
      contents: read
    steps:
      - name: Trigger release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          # Via the environment, not inline: a tag name may contain shell metacharacters.
          REF: ${{ github.ref_name }}
          # A hand-pushed tag publishes too, behind release.yml's own guards (all four
          # bundles attached, a signed APK); otherwise it stays a draft. A manual run
          # publishes only when asked (Cut release asks).
          PUBLISH: ${{ (github.event_name == 'push' || inputs.publish) && 'true' || 'false' }}
        run: |
          # --repo, because this job checks out nothing: gh otherwise resolves the
          # target from `git remote` and fails with "not a git repository".
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" -f ref="$REF" -f publish="$PUBLISH"

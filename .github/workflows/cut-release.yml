name: Cut release

# One button for a release: bumps every manifest, commits and tags on master, then
# runs CI on the tag, which hands off to Release. With "publish" on (the default),
# Release takes the draft live once every bundle is attached and the APK is
# release-signed; otherwise it stops at the draft, as a hand-pushed tag does.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'patch, minor, major, or an exact version (1.4.0)'
        required: true
        default: patch
        type: string
      prerelease:
        description: 'Optional pre-release suffix for the tag (beta.1 makes v1.2.0-beta.1)'
        required: false
        type: string
      publish:
        description: 'Publish automatically once every build is attached'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Two cuts at once would race for the same version.
  group: cut-release
  cancel-in-progress: false

jobs:
  cut:
    name: Bump, tag and start the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # push the bump commit and the tag
      actions: write    # dispatch CI on the tag
    steps:
      - name: Only from master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Run Cut release from master (this run is on $GITHUB_REF_NAME)."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Bump versions
        id: bump
        env:
          # Via the environment, not inline: inputs are free text.
          BUMP: ${{ inputs.bump }}
          SUFFIX: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          SUFFIX="${SUFFIX#-}"
          if [ -n "$SUFFIX" ] && ! [[ "$SUFFIX" =~ ^[0-9A-Za-z][0-9A-Za-z.-]*$ ]]; then
            echo "::error::Pre-release suffix '$SUFFIX' may only hold letters, digits, dots and hyphens."
            exit 1
          fi
          VERSION="$(node web/scripts/bump-version.mjs "$BUMP")"
          TAG="v$VERSION${SUFFIX:+-$SUFFIX}"
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null \
              || git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists. Pick another bump or suffix."
            exit 1
          fi
          # Same check the release itself makes, so a bad tag fails here, before any push.
          node web/scripts/check-version.mjs "$TAG" > /dev/null
          printf 'version=%s\ntag=%s\n' "$VERSION" "$TAG" | tee -a "$GITHUB_OUTPUT"

      - name: Commit, tag and push
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # An exact version equal to the current one (say, a beta then the final
          # 1.2.0) changes nothing, so the tag goes on master as it stands.
          if ! git diff --quiet; then
            git commit -qam "Release $TAG"
          fi
          git tag -a "$TAG" -m "Winnow $TAG"
          # Atomic: master and the tag land together or not at all.
          git push --atomic origin HEAD:master "refs/tags/$TAG"

      - name: Run CI on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
          PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f publish="$PUBLISH"
          {
            echo "Cut **$TAG**. CI is running on the tag and hands off to Release when it passes."
            if [ "$PUBLISH" = "true" ]; then
              echo "Release publishes it once every bundle is attached and the APK is release-signed."
            else
              echo "Release stops at a draft for you to publish."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

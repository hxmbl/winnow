name: Release

# Triggered by CI after it passes on a tag, or manually for testing.
# A `v<MAJOR.MINOR.PATCH>[-suffix]` tag builds every platform and attaches the
# bundles to a draft GitHub Release; a suffix marks it a pre-release. A manual run
# builds the same bundles as workflow artifacts and leaves Releases alone.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to build'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  # Keyed on the ref actually being built: under workflow_dispatch `github.ref` is
  # always the default branch, which would serialise every release into one group.
  group: release-${{ github.event.inputs.ref || github.ref }}
  # Never cancel a release half-way through uploading its assets.
  cancel-in-progress: false

jobs:
  # Creates the draft once, so the platform jobs don't race to create it.
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check versions
        id: meta
        run: |
          set -euo pipefail
          TAG="" PUBLISH=false PRERELEASE=false
          # Use the ref that was passed from CI or manual dispatch
          REF="${{ inputs.ref }}"
          if [ -n "$REF" ] && [[ "$REF" == v* ]]; then
            TAG="$REF" PUBLISH=true
            case "$TAG" in *-*) PRERELEASE=true ;; esac
          fi
          # Fails when the manifests disagree with each other or with the tag.
          VERSION="$(node web/scripts/check-version.mjs "$TAG")"

          printf 'version=%s\ntag=%s\nprerelease=%s\npublish=%s\n' \
            "$VERSION" "$TAG" "$PRERELEASE" "$PUBLISH" | tee -a "$GITHUB_OUTPUT"

      - name: Create draft release
        if: steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          # A re-run reuses the draft it made the first time.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it."
            exit 0
          fi

          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          ## Downloads

          | Platform | File |
          | --- | --- |
          | Linux | `.AppImage` (any distro) or `.deb` (Debian, Ubuntu) |
          | macOS | `.dmg`, universal (Apple silicon and Intel) |
          | Windows | `.msi` or `-setup.exe`, when the Windows build succeeded |
          | Android | `_android-universal.apk` (any phone, Android 7+), when the Android build succeeded |

          These builds are **not code-signed**. On macOS, right-click the app and choose
          **Open** the first time, or run `xattr -dr com.apple.quarantine /Applications/Winnow.app`.
          On Windows, SmartScreen may say it protected your PC: choose **More info**, then
          **Run anyway**. On Android, Play Protect may warn about an unknown developer:
          choose **Install anyway**. An APK named `-debug` is signed with a throwaway key,
          so installing a later one may require uninstalling it first. If you have an
          earlier `-debug` APK installed, uninstall it once before installing a signed
          one (no `-debug`): Android refuses an update signed with a different key. The
          APK's SHA-256 and signing certificate are in the release run's summary.
          See the README.

          Winnow ships no Google sign-in client. To connect Gmail, create your own OAuth
          client in Google Cloud and paste it into the app; see `docs/google-setup.md`.
          The demo mailbox works without one.

          EOF

          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --prerelease="$PRERELEASE" --title "Winnow $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    # Windows is best-effort: its failure doesn't stop the other uploads.
    continue-on-error: ${{ matrix.slug == 'windows' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04, not latest: an AppImage only runs on a glibc at least as new
          # as the one it was built against.
          - name: Linux
            slug: linux
            os: ubuntu-22.04
          - name: macOS
            slug: macos
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            build-args: --target universal-apple-darwin
          - name: Windows
            slug: windows
            os: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/src-tauri -> target
          key: release-${{ matrix.slug }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config wget

      - name: Install create-dmg
        if: runner.os == 'macOS'
        # bundle.mjs refuses to bundle a .dmg without it.
        run: brew install create-dmg

      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install Tauri CLI
        run: cargo binstall tauri-cli --version "^2" --no-confirm

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # No Google secret or client id: each user brings their own OAuth client and
      # pastes it into the app at runtime (docs/google-setup.md).
      - name: Build bundles
        working-directory: web
        run: npm run tauri:build -- ${{ matrix.build-args }}

      - name: Check no client secret shipped
        # Google client secrets start GOCSPX-. Nothing should ever put one in a
        # bundle; this stays as a tripwire.
        run: |
          if grep -rIl 'GOCSPX-' web/dist; then
            echo "::error::The web bundle contains what looks like a Google client secret."
            exit 1
          fi

      - name: Collect bundles
        run: |
          mkdir -p "$RUNNER_TEMP/bundles"
          find native/src-tauri/target -type f -path '*/release/bundle/*' \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' \
               -o -name '*.msi' -o -name '*-setup.exe' \) \
            -exec cp {} "$RUNNER_TEMP/bundles/" \;
          ls -la "$RUNNER_TEMP/bundles"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: winnow-${{ needs.prepare.outputs.version }}-${{ matrix.slug }}
          path: ${{ runner.temp }}/bundles
          if-no-files-found: error

      - name: Attach to draft release
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/bundles/* --clobber --repo "$GITHUB_REPOSITORY"

  # Android is its own job rather than a matrix row: it needs Java, the SDK and NDK,
  # four Rust targets and a different CLI subcommand, and none of the desktop steps.
  android:
    name: Build (Android)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    # Best-effort, like Windows: its failure doesn't stop the desktop uploads.
    continue-on-error: true
    env:
      # Pinned so a new NDK on the runner image can't change the build under us.
      NDK_VERSION: "27.2.12479018"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also asks for `tools`, which the SDK no longer ships, and
          # sdkmanager then fails the step. The NDK is installed below.
          packages: platform-tools

      - name: Install the NDK
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${NDK_VERSION}" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/src-tauri -> target
          key: release-android

      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install Tauri CLI
        run: cargo binstall tauri-cli --version "^2" --no-confirm

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Release signing, from four repository secrets (native/README.md, "Android
      # signing"). With all four set, the keystore is decoded into RUNNER_TEMP, gradle
      # signs the APK and the AAB with it (gen/android/app/build.gradle.kts), and the
      # file is deleted when the step ends, however it ends. With any of them unset
      # (a fork, or before they've been added), gradle falls back to the debug key,
      # the APK keeps its `-debug` name, and the job summary says so. Never fails on
      # missing secrets. The secrets reach only this step, through env, and nothing
      # here echoes them; GitHub masks them in the log regardless.
      - name: Build APK
        id: android-build
        working-directory: native
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          MISSING=""
          for NAME in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!NAME:-}" ]; then MISSING="${MISSING:+$MISSING, }$NAME"; fi
          done

          if [ -n "$MISSING" ]; then
            # Partial secrets must not half-configure gradle: clear them all.
            unset ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
            echo "::notice title=Android APK is debug-signed::Release signing secrets not set (missing: $MISSING). Building the -debug APK instead."
            printf 'signed=false\nmissing=%s\n' "$MISSING" >> "$GITHUB_OUTPUT"
            cargo tauri android build --apk
            exit 0
          fi

          KEYSTORE="$RUNNER_TEMP/winnow-release.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          # Tolerates line-wrapped or CRLF base64 (base64 without -w0, PowerShell).
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 --decode > "$KEYSTORE"
          unset ANDROID_KEYSTORE_BASE64
          chmod 600 "$KEYSTORE"
          export ANDROID_KEYSTORE_PATH="$KEYSTORE"

          # The certificate the keystore holds, to check the APK against below.
          # -storepass:env reads the password from the environment, never the argv.
          if ! CERT_INFO="$(keytool -list -v -keystore "$KEYSTORE" -alias "$ANDROID_KEY_ALIAS" \
                -storepass:env ANDROID_KEYSTORE_PASSWORD 2>&1)"; then
            # keytool's own reason (wrong password, unknown alias, not a keystore) names
            # no secret value; GitHub masks the alias if it appears.
            REASON="$(printf '%s\n' "$CERT_INFO" | grep -m1 -i 'error\|exception\|does not exist\|incorrect' || true)"
            echo "::error::Could not open the release keystore with ANDROID_KEY_ALIAS: ${REASON:-keytool gave no reason}"
            # If the password opens the keystore, the alias is the problem: show which exist.
            if ALIASES="$(keytool -list -keystore "$KEYSTORE" -storepass:env ANDROID_KEYSTORE_PASSWORD 2>/dev/null \
                  | awk -F, '/PrivateKeyEntry/ { print $1 }')"; then
              COUNT="$(printf '%s\n' "$ALIASES" | grep -c . || true)"
              echo "::error::The keystore opens with ANDROID_KEYSTORE_PASSWORD and holds $COUNT key alias(es): $(printf '%s' "$ALIASES" | paste -sd, -). Set ANDROID_KEY_ALIAS to one of them."
            else
              echo "::error::ANDROID_KEYSTORE_PASSWORD does not open the keystore (or ANDROID_KEYSTORE_BASE64 is not the .jks file)."
            fi
            exit 1
          fi
          CERT_SHA256="$(printf '%s\n' "$CERT_INFO" | awk '$1 == "SHA256:" { print $2; exit }')"
          if [ -z "$CERT_SHA256" ]; then
            echo "::error::Could not read the release certificate's SHA-256 fingerprint from the keystore."
            exit 1
          fi

          # The AAB rides along for a future Play Store listing: Rust is already built
          # for the APK, so it only adds gradle's bundle task.
          cargo tauri android build --apk --aab
          printf 'signed=true\ncert_sha256=%s\n' "$CERT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Check no client secret shipped
        run: |
          if grep -rIl 'GOCSPX-' web/dist; then
            echo "::error::The web bundle contains what looks like a Google client secret."
            exit 1
          fi

      - name: Collect, verify and fingerprint
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SIGNED: ${{ steps.android-build.outputs.signed }}
          MISSING: ${{ steps.android-build.outputs.missing }}
          CERT_SHA256: ${{ steps.android-build.outputs.cert_sha256 }}
        run: |
          set -euo pipefail
          OUT=native/src-tauri/gen/android/app/build/outputs
          APK="$(find "$OUT/apk" -type f -name '*universal*release*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::No universal release APK was produced."
            find "$OUT" -type f || true
            exit 1
          fi
          SUFFIX="-debug"
          if [ "$SIGNED" = "true" ]; then SUFFIX=""; fi
          DEST="$RUNNER_TEMP/android"
          mkdir -p "$DEST"
          NAME="Winnow_${VERSION}_android-universal${SUFFIX}"
          cp "$APK" "$DEST/$NAME.apk"

          # Gradle installs build-tools on demand; install one if it didn't.
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$BT" ]; then
            sdkmanager --install "build-tools;35.0.0" > /dev/null
            BT="$ANDROID_HOME/build-tools/35.0.0"
          fi
          CERTS="$("$BT/apksigner" verify --verbose --print-certs "$DEST/$NAME.apk")"
          printf '%s\n' "$CERTS"
          APK_CERT="$(printf '%s\n' "$CERTS" | awk -F': ' '/^Signer #1 certificate SHA-256 digest:/ { print $2; exit }')"
          APK_DN="$(printf '%s\n' "$CERTS" | awk -F': ' '/^Signer #1 certificate DN:/ { print $2; exit }')"
          # apksigner prints lowercase hex, keytool colon-separated uppercase.
          norm() { tr -d ':' | tr '[:upper:]' '[:lower:]'; }

          AAB_LINE=""
          if [ "$SIGNED" = "true" ]; then
            if [ "$(printf '%s' "$APK_CERT" | norm)" != "$(printf '%s' "$CERT_SHA256" | norm)" ]; then
              echo "::error::The APK is not signed with the release keystore's certificate (got: $APK_DN)."
              exit 1
            fi
            AAB="$(find "$OUT/bundle" -type f -name '*universal*elease*.aab' | head -n 1)"
            if [ -n "$AAB" ]; then
              cp "$AAB" "$DEST/$NAME.aab"
              AAB_CERT="$(keytool -printcert -jarfile "$DEST/$NAME.aab" | awk '$1 == "SHA256:" { print $2; exit }')"
              if [ "$(printf '%s' "$AAB_CERT" | norm)" != "$(printf '%s' "$CERT_SHA256" | norm)" ]; then
                echo "::error::The AAB is not signed with the release keystore's certificate."
                exit 1
              fi
              AAB_LINE="| \`$NAME.aab\` (app stores only; phones install the APK) | \`$(sha256sum "$DEST/$NAME.aab" | cut -d' ' -f1)\` |"
            else
              echo "::warning::No AAB was produced; shipping the APK only."
            fi
          fi
          ls -la "$DEST"

          {
            echo "## Android"
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "Release-signed, verified with apksigner against the release keystore."
            else
              echo "> [!WARNING]"
              echo "> **Debug-signed.** The release signing secrets are not set (missing: ${MISSING:-unknown}),"
              echo "> so this APK is signed with the runner's throwaway debug key and named \`-debug\`."
              echo "> See native/README.md, \"Android signing\", to turn release signing on."
            fi
            echo
            echo "| File | SHA-256 |"
            echo "| --- | --- |"
            echo "| \`$NAME.apk\` | \`$(sha256sum "$DEST/$NAME.apk" | cut -d' ' -f1)\` |"
            if [ -n "$AAB_LINE" ]; then echo "$AAB_LINE"; fi
            echo
            echo "Signing certificate SHA-256: \`$APK_CERT\`"
            echo
            echo "Signing certificate DN: \`$APK_DN\`"
            echo
            echo "Check a download with \`apksigner verify --print-certs <file>.apk\` (or \`sha256sum\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: winnow-${{ needs.prepare.outputs.version }}-android
          path: ${{ runner.temp }}/android
          if-no-files-found: error

      - name: Attach to draft release
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/android/*.apk --clobber --repo "$GITHUB_REPOSITORY"

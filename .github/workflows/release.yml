name: Release

# Triggered by CI after it passes on a tag, or manually for testing.
# A `v<MAJOR.MINOR.PATCH>[-suffix]` tag builds every platform and attaches the
# bundles to a draft GitHub Release; a suffix marks it a pre-release. A manual run
# builds the same bundles as workflow artifacts and leaves Releases alone.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to build'
        required: false
        type: string
      publish:
        description: 'Publish the release once every build is attached (tags only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Keyed on the ref actually being built: under workflow_dispatch `github.ref` is
  # always the default branch, which would serialise every release into one group.
  group: release-${{ github.event.inputs.ref || github.ref }}
  # Never cancel a release half-way through uploading its assets.
  cancel-in-progress: false

jobs:
  # Creates the draft once, so the platform jobs don't race to create it.
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
      updater: ${{ steps.updater.outputs.updater }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check versions
        id: meta
        run: |
          set -euo pipefail
          TAG="" PUBLISH=false PRERELEASE=false
          # Use the ref that was passed from CI or manual dispatch
          REF="${{ inputs.ref }}"
          if [ -n "$REF" ] && [[ "$REF" == v* ]]; then
            TAG="$REF" PUBLISH=true
            case "$TAG" in *-*) PRERELEASE=true ;; esac
          fi
          # Fails when the manifests disagree with each other or with the tag.
          VERSION="$(node web/scripts/check-version.mjs "$TAG")"

          printf 'version=%s\ntag=%s\nprerelease=%s\npublish=%s\n' \
            "$VERSION" "$TAG" "$PRERELEASE" "$PUBLISH" | tee -a "$GITHUB_OUTPUT"

      # Self-update (native/README.md, "Updates"): the macOS app and the AppImage are
      # signed with TAURI_SIGNING_PRIVATE_KEY so the installed app can verify a download
      # against the public key in tauri.conf.json. Without the secret (a fork, or before
      # it has been added) the bundles build as before, without updater artifacts or
      # latest.json, and installed apps fall back to opening the release page.
      - name: Check updater signing
        id: updater
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "updater=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=No updater artifacts::TAURI_SIGNING_PRIVATE_KEY is not set, so this release has no latest.json and installed apps cannot update themselves from it."
            echo "updater=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release
        if: steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Any tag with a "-" is a pre-release and never Latest
          # (web/src/core/updates/releaseFlags.ts): the stable channel reads "latest".
          mapfile -t FLAGS < <(node web/scripts/release-flags.mjs create "$TAG")
          # A re-run reuses the draft it made the first time, re-marked by the same rule.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it."
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" "${FLAGS[@]}"
            exit 0
          fi

          # "What's new" is the tag's CHANGELOG.md section (web/scripts/release-notes.mjs):
          # its exact version, or a pre-release's plain one. If the tag's copy has none,
          # the default branch's is tried, so notes added after a tag was pushed count on
          # a re-run. Neither: the release stops here, before any draft or build, rather
          # than going out with generic notes.
          WHATS_NEW="$RUNNER_TEMP/whats-new.md"
          if node web/scripts/release-notes.mjs whats-new "$TAG" > "$WHATS_NEW" 2> "$RUNNER_TEMP/notes.err"; then
            cat "$RUNNER_TEMP/notes.err" >&2
          else
            echo "The tag's CHANGELOG.md has no notes for $TAG; trying $DEFAULT_BRANCH's."
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md?ref=$DEFAULT_BRANCH" \
              > "$RUNNER_TEMP/CHANGELOG.md" || : > "$RUNNER_TEMP/CHANGELOG.md"
            node web/scripts/release-notes.mjs whats-new "$TAG" "$RUNNER_TEMP/CHANGELOG.md" > "$WHATS_NEW"
            echo "::notice title=Release notes::$TAG's notes come from $DEFAULT_BRANCH's CHANGELOG.md."
          fi
          cat "$WHATS_NEW"

          cp "$WHATS_NEW" "$RUNNER_TEMP/notes.md"
          cat >> "$RUNNER_TEMP/notes.md" <<'EOF'
          ## Downloads

          | Platform | File |
          | --- | --- |
          | Linux | `.AppImage` (any distro) or `.deb` (Debian, Ubuntu) |
          | macOS | `.dmg`, universal (Apple silicon and Intel) |
          | Android | `_android-universal.apk` (any phone, Android 7+), when the Android build succeeded |

          There is no Windows build. On Windows, run the web app instead: with Docker
          (`docker compose up -d`, image `ghcr.io/hxmbl/winnow`), or build `web/` and
          host it yourself (Railway works); see the README. A Docker container fetches
          the newest release each time it starts, so restarting it is the update.

          These builds are **not code-signed**. On macOS, right-click the app and choose
          **Open** the first time, or run `xattr -dr com.apple.quarantine /Applications/Winnow.app`.
          On Android, Play Protect may warn about an unknown developer:
          choose **Install anyway**. An APK named `-debug` is signed with a throwaway key,
          so installing a later one may require uninstalling it first. If you have an
          earlier `-debug` APK installed, uninstall it once before installing a signed
          one (no `-debug`): Android refuses an update signed with a different key.
          `SHA256SUMS` lists every file's SHA-256 (`sha256sum -c SHA256SUMS
          --ignore-missing`), and the app checks an APK or `.deb` against it before
          installing. The APK's signing certificate is in the release run's summary.
          See the README.

          Winnow ships no Google sign-in client. To connect Gmail, create your own OAuth
          client in Google Cloud and paste it into the app; see `docs/google-setup.md`.
          The demo mailbox works without one.

          EOF

          # PRERELEASE (from the tag in "Check versions") and FLAGS agree; FLAGS also
          # keeps a pre-release from ever being made Latest.
          echo "Pre-release: $PRERELEASE"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            "${FLAGS[@]}" --title "Winnow $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # The tag, suffix and all, for the version the app reports (About, update checks):
      # the manifests hold only the bare version. See web/src/core/updates/buildVersion.ts.
      WINNOW_RELEASE_VERSION: ${{ needs.prepare.outputs.tag }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04, not latest: an AppImage only runs on a glibc at least as new
          # as the one it was built against.
          - name: Linux
            slug: linux
            os: ubuntu-22.04
          - name: macOS
            slug: macos
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            build-args: --target universal-apple-darwin
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/src-tauri -> target
          key: release-${{ matrix.slug }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config wget

      - name: Install create-dmg
        if: runner.os == 'macOS'
        # bundle.mjs refuses to bundle a .dmg without it.
        run: brew install create-dmg

      - name: Select Xcode 26
        if: runner.os == 'macOS'
        # The bundler compiles icons/Winnow.icon (the Liquid Glass icon) into
        # Assets.car with actool, which must be Xcode 26 or later. With an older
        # one it logs an error, skips the Assets.car and Tahoe greys the icon.
        run: |
          set -euo pipefail
          ok() { actool --version --output-format=human-readable-text | grep -Eq 'short-bundle-version: (2[6-9]|[3-9][0-9])'; }
          if ! ok; then
            XCODE="$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -vi beta | sort -V | tail -n 1 || true)"
            if [ -z "$XCODE" ]; then
              echo "::error::No Xcode 26+ on this runner; the Liquid Glass icon needs it."
              exit 1
            fi
            sudo xcode-select -s "$XCODE"
          fi
          ok
          xcode-select -p

      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2.87.31  # v2.87.32 (2026-10-26) fails on macOS runners; unpin once fixed
        with:
          tool: cargo-binstall

      - name: Install Tauri CLI
        run: cargo binstall tauri-cli --version "^2" --no-confirm

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # No Google secret or client id: each user brings their own OAuth client and
      # pastes it into the app at runtime (docs/google-setup.md).
      # With the signing key, also the updater artifacts: the macOS `.app.tar.gz` and a
      # `.sig` beside each bundle. The key and its password reach only this step.
      - name: Build bundles
        working-directory: web
        env:
          UPDATER: ${{ needs.prepare.outputs.updater }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Tauri skips the .dmg window layout (background, icon positions) whenever
          # CI=true. GitHub's macOS runners have a real Finder session, so let it run.
          TAURI_BUNDLER_DMG_IGNORE_CI: ${{ runner.os == 'macOS' && 'true' || 'false' }}
        timeout-minutes: 45
        run: |
          set -euo pipefail
          EXTRA=()
          if [ "$UPDATER" = "true" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":true}}' > "$RUNNER_TEMP/updater.json"
            EXTRA=(--config "$RUNNER_TEMP/updater.json")
          else
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          # `${EXTRA[@]+…}`: macOS runs bash 3.2, where an empty array is "unbound" under `set -u`.
          npm run tauri:build -- ${{ matrix.build-args }} ${EXTRA[@]+"${EXTRA[@]}"}

      - name: Check the Liquid Glass icon
        if: runner.os == 'macOS'
        # Tahoe draws the icon from Assets.car (named by CFBundleIconName); older
        # macOS falls back to icon.icns (CFBundleIconFile). Both must be there.
        run: |
          set -euo pipefail
          APP="$(find native/src-tauri/target -type d -path '*/release/bundle/macos/*.app' | head -n 1)"
          RES="$APP/Contents/Resources"
          ls -la "$RES"
          NAME="$(plutil -extract CFBundleIconName raw "$APP/Contents/Info.plist" || true)"
          FILE="$(plutil -extract CFBundleIconFile raw "$APP/Contents/Info.plist" || true)"
          echo "CFBundleIconName=$NAME CFBundleIconFile=$FILE"
          if [ ! -s "$RES/Assets.car" ] || [ -z "$NAME" ] || [ ! -s "$RES/$FILE" ]; then
            echo "::error::The app is missing Assets.car, CFBundleIconName or its .icns fallback."
            exit 1
          fi
          assetutil --info "$RES/Assets.car" | grep -E '"(AssetType|Name|Appearance)"' | sort | uniq -c

      - name: Check no client secret shipped
        # Google client secrets start GOCSPX-. Nothing should ever put one in a
        # bundle; this stays as a tripwire.
        run: |
          if grep -rIl 'GOCSPX-' web/dist; then
            echo "::error::The web bundle contains what looks like a Google client secret."
            exit 1
          fi

      - name: Collect bundles
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/bundles"
          mkdir -p "$OUT"
          find native/src-tauri/target -type f -path '*/release/bundle/*' \
            \( -name '*.AppImage' -o -name '*.AppImage.sig' -o -name '*.deb' -o -name '*.dmg' \) \
            -exec cp {} "$OUT/" \;
          # The macOS updater tarball is named `Winnow.app.tar.gz` whatever the version;
          # it is attached under a versioned, universal name (latest.json points at it).
          # The signature covers the bytes, not the name, so renaming keeps it valid.
          TARBALL="$(find native/src-tauri/target -type f -path '*/release/bundle/macos/*' -name '*.app.tar.gz' | head -n 1)"
          if [ -n "$TARBALL" ]; then
            cp "$TARBALL" "$OUT/Winnow_${VERSION}_universal.app.tar.gz"
            if [ -f "$TARBALL.sig" ]; then cp "$TARBALL.sig" "$OUT/Winnow_${VERSION}_universal.app.tar.gz.sig"; fi
          fi
          ls -la "$OUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: winnow-${{ needs.prepare.outputs.version }}-${{ matrix.slug }}
          path: ${{ runner.temp }}/bundles
          if-no-files-found: error

      - name: Attach to draft release
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/bundles/* --clobber --repo "$GITHUB_REPOSITORY"

  # The prebuilt web app and render proxy the Docker images fetch on every start
  # (docker/fetch-release.sh): `winnow-web-<version>.tar.gz` and
  # `winnow-proxy-<version>.tar.gz`, each with a `.sha256` the container checks before
  # it unpacks anything. The layout is docker/bundle.sh's, the same one the images bake
  # in. The web build has no VITE_RENDER_PROXY: a container names its proxy at run time.
  web-bundle:
    name: Build (web and proxy bundles)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The tag, suffix and all, for the version the app reports (About, update checks):
      # the manifests hold only the bare version. See web/src/core/updates/buildVersion.ts.
      WINNOW_RELEASE_VERSION: ${{ needs.prepare.outputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build the web bundle
        working-directory: web
        env:
          VITE_RENDER_PROXY: ""
        run: npx vite build --logLevel warn

      - name: Package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/docker-bundles"
          mkdir -p "$OUT"
          for KIND in web proxy; do
            sh docker/bundle.sh "$KIND" . "$RUNNER_TEMP/$KIND"
            test "$(cat "$RUNNER_TEMP/$KIND/VERSION")" = "$VERSION"
            NAME="winnow-${KIND}-${VERSION}.tar.gz"
            # Plain files, root-owned, stable order: what fetch-release.sh accepts.
            tar --sort=name --owner=0 --group=0 --numeric-owner -czf "$OUT/$NAME" -C "$RUNNER_TEMP/$KIND" .
            (cd "$OUT" && sha256sum "$NAME" > "$NAME.sha256")
          done
          ls -la "$OUT"
          cat "$OUT"/*.sha256

      # The proxy bundle must run as shipped: start it from the archive and ask /health.
      # A new import in the sanitiser that bundle.sh does not copy fails here.
      - name: Start the bundled proxy
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/proxy-check"
          mkdir -p "$DIR"
          tar -xzf "$RUNNER_TEMP/docker-bundles/winnow-proxy-${VERSION}.tar.gz" -C "$DIR"
          cd "$DIR/proxy"
          PORT=8799 node --experimental-strip-types server.ts > "$RUNNER_TEMP/proxy.log" 2>&1 &
          PID=$!
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8799/health; then kill "$PID"; exit 0; fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/proxy.log"
          exit 1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: winnow-${{ needs.prepare.outputs.version }}-docker-bundles
          path: ${{ runner.temp }}/docker-bundles
          if-no-files-found: error

      - name: Attach to draft release
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/docker-bundles/* --clobber --repo "$GITHUB_REPOSITORY"

  # Android is its own job rather than a matrix row: it needs Java, the SDK and NDK,
  # four Rust targets and a different CLI subcommand, and none of the desktop steps.
  android:
    name: Build (Android)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    # Best-effort: its failure doesn't stop the desktop uploads.
    continue-on-error: true
    env:
      # The tag, suffix and all, for the version the app reports (About, update checks):
      # the manifests hold only the bare version. See web/src/core/updates/buildVersion.ts.
      WINNOW_RELEASE_VERSION: ${{ needs.prepare.outputs.tag }}
      # Pinned so a new NDK on the runner image can't change the build under us.
      NDK_VERSION: "27.2.12479018"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also asks for `tools`, which the SDK no longer ships, and
          # sdkmanager then fails the step. The NDK is installed below.
          packages: platform-tools

      - name: Install the NDK
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${NDK_VERSION}" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/src-tauri -> target
          key: release-android

      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2.87.31  # v2.87.32 (2026-10-26) fails on macOS runners; unpin once fixed
        with:
          tool: cargo-binstall

      - name: Install Tauri CLI
        run: cargo binstall tauri-cli --version "^2" --no-confirm

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Release signing, from four repository secrets (native/README.md, "Android
      # signing"). With all four set, the keystore is decoded into RUNNER_TEMP, gradle
      # signs the APK and the AAB with it (gen/android/app/build.gradle.kts), and the
      # file is deleted when the step ends, however it ends. With any of them unset
      # (a fork, or before they've been added), gradle falls back to the debug key,
      # the APK keeps its `-debug` name, and the job summary says so. Never fails on
      # missing secrets. The secrets reach only this step, through env, and nothing
      # here echoes them; GitHub masks them in the log regardless.
      - name: Build APK
        id: android-build
        working-directory: native
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          MISSING=""
          for NAME in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!NAME:-}" ]; then MISSING="${MISSING:+$MISSING, }$NAME"; fi
          done

          if [ -n "$MISSING" ]; then
            # Partial secrets must not half-configure gradle: clear them all.
            unset ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
            echo "::notice title=Android APK is debug-signed::Release signing secrets not set (missing: $MISSING). Building the -debug APK instead."
            printf 'signed=false\nmissing=%s\n' "$MISSING" >> "$GITHUB_OUTPUT"
            cargo tauri android build --apk
            exit 0
          fi

          KEYSTORE="$RUNNER_TEMP/winnow-release.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          # Tolerates line-wrapped or CRLF base64 (base64 without -w0, PowerShell).
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 --decode > "$KEYSTORE"
          unset ANDROID_KEYSTORE_BASE64
          chmod 600 "$KEYSTORE"
          export ANDROID_KEYSTORE_PATH="$KEYSTORE"

          # The certificate the keystore holds, to check the APK against below.
          # -storepass:env reads the password from the environment, never the argv.
          if ! CERT_INFO="$(keytool -list -v -keystore "$KEYSTORE" -alias "$ANDROID_KEY_ALIAS" \
                -storepass:env ANDROID_KEYSTORE_PASSWORD 2>&1)"; then
            # keytool's own reason (wrong password, unknown alias, not a keystore) names
            # no secret value; GitHub masks the alias if it appears.
            REASON="$(printf '%s\n' "$CERT_INFO" | grep -m1 -i 'error\|exception\|does not exist\|incorrect' || true)"
            echo "::error::Could not open the release keystore with ANDROID_KEY_ALIAS: ${REASON:-keytool gave no reason}"
            # If the password opens the keystore, the alias is the problem: show which exist.
            if ALIASES="$(keytool -list -keystore "$KEYSTORE" -storepass:env ANDROID_KEYSTORE_PASSWORD 2>/dev/null \
                  | awk -F, '/PrivateKeyEntry/ { print $1 }')"; then
              COUNT="$(printf '%s\n' "$ALIASES" | grep -c . || true)"
              echo "::error::The keystore opens with ANDROID_KEYSTORE_PASSWORD and holds $COUNT key alias(es): $(printf '%s' "$ALIASES" | paste -sd, -). Set ANDROID_KEY_ALIAS to one of them."
            else
              echo "::error::ANDROID_KEYSTORE_PASSWORD does not open the keystore (or ANDROID_KEYSTORE_BASE64 is not the .jks file)."
            fi
            exit 1
          fi
          CERT_SHA256="$(printf '%s\n' "$CERT_INFO" | awk '$1 == "SHA256:" { print $2; exit }')"
          if [ -z "$CERT_SHA256" ]; then
            echo "::error::Could not read the release certificate's SHA-256 fingerprint from the keystore."
            exit 1
          fi

          # The AAB rides along for a future Play Store listing: Rust is already built
          # for the APK, so it only adds gradle's bundle task.
          cargo tauri android build --apk --aab
          printf 'signed=true\ncert_sha256=%s\n' "$CERT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Check no client secret shipped
        run: |
          if grep -rIl 'GOCSPX-' web/dist; then
            echo "::error::The web bundle contains what looks like a Google client secret."
            exit 1
          fi

      - name: Collect, verify and fingerprint
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SIGNED: ${{ steps.android-build.outputs.signed }}
          MISSING: ${{ steps.android-build.outputs.missing }}
          CERT_SHA256: ${{ steps.android-build.outputs.cert_sha256 }}
        run: |
          set -euo pipefail
          OUT=native/src-tauri/gen/android/app/build/outputs
          APK="$(find "$OUT/apk" -type f -name '*universal*release*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::No universal release APK was produced."
            find "$OUT" -type f || true
            exit 1
          fi
          SUFFIX="-debug"
          if [ "$SIGNED" = "true" ]; then SUFFIX=""; fi
          DEST="$RUNNER_TEMP/android"
          mkdir -p "$DEST"
          NAME="Winnow_${VERSION}_android-universal${SUFFIX}"
          cp "$APK" "$DEST/$NAME.apk"

          # Gradle installs build-tools on demand; install one if it didn't.
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$BT" ]; then
            sdkmanager --install "build-tools;35.0.0" > /dev/null
            BT="$ANDROID_HOME/build-tools/35.0.0"
          fi
          CERTS="$("$BT/apksigner" verify --verbose --print-certs "$DEST/$NAME.apk")"
          printf '%s\n' "$CERTS"
          APK_CERT="$(printf '%s\n' "$CERTS" | awk -F': ' '/certificate SHA-256 digest:/ { print $NF; exit }')"
          APK_DN="$(printf '%s\n' "$CERTS" | sed -n 's/.*certificate DN: //p' | head -n1)"
          # apksigner names the signer by scheme ("Signer #1" for v1, "V2 Signer" when
          # minSdk skips v1), so match the field, not the prefix. It prints lowercase
          # hex; keytool prints colon-separated uppercase.
          norm() { tr -d ':' | tr '[:upper:]' '[:lower:]'; }

          AAB_LINE=""
          if [ "$SIGNED" = "true" ]; then
            if [ "$(printf '%s' "$APK_CERT" | norm)" != "$(printf '%s' "$CERT_SHA256" | norm)" ]; then
              echo "::error::The APK is not signed with the release keystore's certificate (got: $APK_DN)."
              exit 1
            fi
            AAB="$(find "$OUT/bundle" -type f -name '*universal*elease*.aab' | head -n 1)"
            if [ -n "$AAB" ]; then
              cp "$AAB" "$DEST/$NAME.aab"
              AAB_CERT="$(keytool -printcert -jarfile "$DEST/$NAME.aab" | awk '$1 == "SHA256:" { print $2; exit }')"
              if [ "$(printf '%s' "$AAB_CERT" | norm)" != "$(printf '%s' "$CERT_SHA256" | norm)" ]; then
                echo "::error::The AAB is not signed with the release keystore's certificate."
                exit 1
              fi
              AAB_LINE="| \`$NAME.aab\` (app stores only; phones install the APK) | \`$(sha256sum "$DEST/$NAME.aab" | cut -d' ' -f1)\` |"
            else
              echo "::warning::No AAB was produced; shipping the APK only."
            fi
          fi
          ls -la "$DEST"

          {
            echo "## Android"
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "Release-signed, verified with apksigner against the release keystore."
            else
              echo "> [!WARNING]"
              echo "> **Debug-signed.** The release signing secrets are not set (missing: ${MISSING:-unknown}),"
              echo "> so this APK is signed with the runner's throwaway debug key and named \`-debug\`."
              echo "> See native/README.md, \"Android signing\", to turn release signing on."
            fi
            echo
            echo "| File | SHA-256 |"
            echo "| --- | --- |"
            echo "| \`$NAME.apk\` | \`$(sha256sum "$DEST/$NAME.apk" | cut -d' ' -f1)\` |"
            if [ -n "$AAB_LINE" ]; then echo "$AAB_LINE"; fi
            echo
            echo "Signing certificate SHA-256: \`$APK_CERT\`"
            echo
            echo "Signing certificate DN: \`$APK_DN\`"
            echo
            echo "Check a download with \`apksigner verify --print-certs <file>.apk\` (or \`sha256sum\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: winnow-${{ needs.prepare.outputs.version }}-android
          path: ${{ runner.temp }}/android
          if-no-files-found: error

      - name: Attach to draft release
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/android/*.apk --clobber --repo "$GITHUB_REPOSITORY"

  # latest.json for the Tauri updater, from the signatures the builds attached and the
  # release's "What's new" (its CHANGELOG.md section, so the updater's `notes` match the
  # Releases page). Only with the signing key; publishing regenerates it so notes
  # edited on the draft are carried.
  updater-manifest:
    name: Updater manifest
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.updater == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Write and attach latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          SIGS="$RUNNER_TEMP/sigs"
          mkdir -p "$SIGS"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir "$SIGS" --clobber
          # The notes are the body's "What's new" (seeded from CHANGELOG.md, and whatever
          # was edited on the draft since), else the tag's CHANGELOG.md section.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/body.md"
          node web/scripts/release-notes.mjs from-body "$RUNNER_TEMP/body.md" "$TAG" > "$RUNNER_TEMP/notes.md"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            node web/scripts/updater-manifest.mjs "$SIGS" "$VERSION" "$TAG" "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/latest.json"
          gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --clobber --repo "$GITHUB_REPOSITORY"

  # Cut release (or a manual run with publish) takes the draft live, but only when
  # every bundle is attached and the APK is release-signed. Anything missing leaves
  # the draft for a look, rather than shipping a release without Android.
  # SHA256SUMS for every file on the release, which the app checks a downloaded APK or
  # .deb against before it opens the installer (the updater's own signature covers the
  # macOS tarball and the AppImage). Runs for a draft too, so a release published by
  # hand still carries it. latest.json is left out: publish rewrites it from the notes.
  checksums:
    name: Checksums
    needs: [prepare, build, web-bundle, android, updater-manifest]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Write SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/assets"
          mkdir -p "$DIR"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$DIR" --clobber
          rm -f "$DIR/SHA256SUMS" "$DIR/latest.json"
          (cd "$DIR" && find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs -d '\n' sha256sum) > "$RUNNER_TEMP/SHA256SUMS"
          cat "$RUNNER_TEMP/SHA256SUMS"
          gh release upload "$TAG" "$RUNNER_TEMP/SHA256SUMS" --clobber --repo "$GITHUB_REPOSITORY"
          {
            echo "### SHA256SUMS"
            echo '```'
            cat "$RUNNER_TEMP/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish release
    needs: [prepare, build, web-bundle, android, updater-manifest, checksums]
    if: ${{ !cancelled() && needs.prepare.outputs.publish == 'true' && inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      # Dispatching docker.yml once the release is live.
      actions: write
    steps:
      - name: Checkout code
        if: needs.prepare.outputs.updater == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js
        if: needs.prepare.outputs.updater == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Notes may have been edited on the draft since the builds: write latest.json again
      # from the body as it is now, so the updater's notes match what goes live.
      - name: Refresh latest.json
        if: needs.prepare.outputs.updater == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          SIGS="$RUNNER_TEMP/sigs"
          mkdir -p "$SIGS"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir "$SIGS" --clobber
          # The notes are the body's "What's new" (seeded from CHANGELOG.md, and whatever
          # was edited on the draft since), else the tag's CHANGELOG.md section.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/body.md"
          node web/scripts/release-notes.mjs from-body "$RUNNER_TEMP/body.md" "$TAG" > "$RUNNER_TEMP/notes.md"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            node web/scripts/updater-manifest.mjs "$SIGS" "$VERSION" "$TAG" "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/latest.json"
          gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Check every bundle is attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          UPDATER: ${{ needs.prepare.outputs.updater }}
        run: |
          set -euo pipefail
          ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          printf 'Attached:\n%s\n' "$ASSETS"
          MISSING=""
          SUFFIXES="amd64.AppImage amd64.deb universal.dmg android-universal.apk"
          # With the signing key, self-update is part of the release: the signed macOS
          # tarball, both signatures and latest.json must be there too. Without it the
          # release publishes as before and the notice in the job summary says why.
          if [ "$UPDATER" = "true" ]; then
            SUFFIXES="$SUFFIXES universal.app.tar.gz universal.app.tar.gz.sig amd64.AppImage.sig"
            printf '%s\n' "$ASSETS" | grep -qxF "latest.json" || MISSING="$MISSING latest.json"
          fi
          for SUFFIX in $SUFFIXES; do
            NAME="Winnow_${VERSION}_${SUFFIX}"
            printf '%s\n' "$ASSETS" | grep -qxF "$NAME" || MISSING="$MISSING $NAME"
          done
          # What the app checks an APK or .deb against before installing it.
          printf '%s\n' "$ASSETS" | grep -qxF "SHA256SUMS" || MISSING="$MISSING SHA256SUMS"
          # What Docker containers fetch on start: without them a restart cannot update.
          for NAME in "winnow-web-${VERSION}.tar.gz" "winnow-proxy-${VERSION}.tar.gz"; do
            for FILE in "$NAME" "$NAME.sha256"; do
              printf '%s\n' "$ASSETS" | grep -qxF "$FILE" || MISSING="$MISSING $FILE"
            done
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Not publishing: missing$MISSING. The draft is left for you to finish or publish by hand."
            exit 1
          fi
          if printf '%s\n' "$ASSETS" | grep -q -- '-debug\.apk$'; then
            echo "::error::Not publishing: a debug-signed APK is attached."
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          # A pre-release (a "-" tag, or ticked as one on the draft) stays a pre-release
          # and never becomes "Latest" (web/src/core/updates/releaseFlags.ts).
          IS_PRE="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
          mapfile -t FLAGS < <(node web/scripts/release-flags.mjs publish "$TAG" "$IS_PRE")
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" "${FLAGS[@]}"
          # Belt and braces: the stable channel reads releases/latest (and its
          # latest.json). If GitHub ever calls a pre-release Latest anyway, give Latest
          # back to the newest stable release and fail the run so someone looks.
          if [ "$(node web/scripts/release-flags.mjs prerelease "$TAG")" = "true" ]; then
            LATEST="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"
            if [ "$LATEST" = "$TAG" ]; then
              STABLE="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" \
                --jq '[.[] | select(.draft == false and .prerelease == false and (.tag_name | contains("-") | not))][0].tag_name // empty')"
              if [ -n "$STABLE" ]; then gh release edit "$STABLE" --repo "$GITHUB_REPOSITORY" --latest; fi
              echo "::error::$TAG was marked Latest; Latest is back on ${STABLE:-nothing}. Check the release."
              exit 1
            fi
          fi
          URL="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          echo "Published $URL"
          echo "Published [Winnow $TAG]($URL)." >> "$GITHUB_STEP_SUMMARY"

      # The images on ghcr.io. A release published with GITHUB_TOKEN fires no
      # `release` event, so docker.yml is started by hand (one published in the UI
      # starts it itself).
      - name: Build the Docker images
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh workflow run docker.yml --repo "$GITHUB_REPOSITORY" -f tag="$TAG"
